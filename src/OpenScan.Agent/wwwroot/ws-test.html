<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenScan — Test WebSocket</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #111418; color: #e8eaed; }
  header { padding: 12px 16px; background: #1a1f26; border-bottom: 1px solid #2a313b; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #e05252; display: inline-block; }
  .dot.on { background: #3fce6c; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: #1a1f26; border: 1px solid #2a313b; border-radius: 8px; padding: 12px; }
  section h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; color: #9aa4b2; }
  label { display: block; font-size: 12px; color: #9aa4b2; margin: 8px 0 4px; }
  input, select, button { font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid #39424e; background: #111418; color: #e8eaed; }
  input, select { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; background: #2b6cb0; border-color: #2b6cb0; margin-top: 8px; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  #log { list-style: none; margin: 8px 0 0; padding: 0; max-height: 60vh; overflow: auto; font-size: 12px; }
  #log li { border-top: 1px solid #2a313b; padding: 6px 4px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #2b6cb0; margin-right: 6px; font-weight: 600; }
  .badge.page { background: #6b46c1; }
  .badge.scan { background: #2f855a; }
  .meta { color: #9aa4b2; }
  details { margin-top: 4px; }
  pre { background: #0d1014; padding: 8px; border-radius: 6px; overflow: auto; }
  .counts { font-size: 12px; color: #9aa4b2; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>OpenScan — Test WebSocket temps réel</h1>
  <span id="status" class="meta">déconnecté</span>
</header>
<main>
  <div>
    <section>
      <h2>1. Connexion WebSocket</h2>
      <label for="wsUrl">URL du WebSocket</label>
      <input id="wsUrl" value="" />
      <div class="row">
        <button id="btnConnect">Connecter</button>
        <button id="btnDisconnect" class="ghost" disabled>Déconnecter</button>
      </div>
      <label><input type="checkbox" id="fltScan" checked style="width:auto" /> événements scan.*</label>
      <label><input type="checkbox" id="fltPage" checked style="width:auto" /> événements page.*</label>
      <div class="counts" id="counts">0 événement reçu</div>
      <button id="btnClear" class="ghost">Vider le log</button>
    </section>
    <section style="margin-top:16px">
      <h2>2. Déclencher un scan (REST)</h2>
      <label for="scanner">Scanner</label>
      <select id="scanner"></select>
      <div class="row">
        <div style="flex:1"><label for="source">Source</label><input id="source" value="adf" /></div>
        <div style="flex:1"><label for="resolution">Résolution</label><input id="resolution" value="300" type="number" /></div>
      </div>
      <button id="btnScan">POST /api/v1/scans</button>
      <div class="meta" id="scanResult" style="margin-top:8px"></div>
    </section>
  </div>
  <section>
    <h2>Événements live</h2>
    <ul id="log"></ul>
  </section>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const wsUrl = $('wsUrl'), dot = $('dot'), status = $('status');
  const btnConnect = $('btnConnect'), btnDisconnect = $('btnDisconnect'), btnClear = $('btnClear');
  const log = $('log'), counts = $('counts');
  const fltScan = $('fltScan'), fltPage = $('fltPage');
  const scannerSel = $('scanner'), btnScan = $('btnScan'), scanResult = $('scanResult');
  let ws = null, total = 0;
  const perType = {};

  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  wsUrl.value = proto + location.host + '/ws';
  const apiBase = location.origin;

  function setState(on, msg) {
    dot.classList.toggle('on', on);
    status.textContent = msg;
    btnConnect.disabled = on;
    btnDisconnect.disabled = !on;
  }

  function addItem(evt) {
    const name = evt.event || '?';
    if (name.startsWith('scan.') && !fltScan.checked) return;
    if (name.startsWith('page.') && !fltPage.checked) return;
    total++;
    perType[name] = (perType[name] || 0) + 1;
    counts.textContent = total + ' événement(s) — ' + Object.entries(perType).map(([k, v]) => k + ': ' + v).join(', ');

    const li = document.createElement('li');
    const cls = name.startsWith('page.') ? 'badge page' : 'badge scan';
    const time = evt.timestamp ? new Date(evt.timestamp).toLocaleTimeString() : '';
    li.innerHTML = '<span class="' + cls + '"></span> <span class="meta"></span>';
    li.querySelector('.badge').textContent = name;
    li.querySelector('.meta').textContent = (evt.jobId || '') + (evt.pageNumber ? ' p.' + evt.pageNumber : '') + ' ' + time;
    const det = document.createElement('details');
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(evt, null, 2);
    det.appendChild(pre);
    const sum = document.createElement('summary');
    sum.textContent = 'JSON brut';
    det.prepend(sum);
    li.appendChild(det);
    log.prepend(li);
  }

  btnConnect.onclick = () => {
    try { ws = new WebSocket(wsUrl.value); } catch (e) { status.textContent = 'URL invalide'; return; }
    status.textContent = 'connexion…';
    ws.onopen = () => setState(true, 'connecté à ' + wsUrl.value);
    ws.onmessage = (e) => { try { addItem(JSON.parse(e.data)); } catch { /* ignore */ } };
    ws.onerror = () => { status.textContent = 'erreur (voir console)'; };
    ws.onclose = (e) => setState(false, 'fermé (' + (e.code || '?') + ')');
  };
  btnDisconnect.onclick = () => { if (ws) ws.close(1000, 'test manuel'); };
  btnClear.onclick = () => { log.innerHTML = ''; total = 0; for (const k in perType) delete perType[k]; counts.textContent = '0 événement reçu'; };

  async function loadScanners() {
    try {
      const r = await fetch(apiBase + '/api/v1/scanners');
      const list = await r.json();
      scannerSel.innerHTML = '';
      list.forEach(s => {
        const o = document.createElement('option');
        o.value = s.id; o.textContent = s.name + ' (' + s.id + ')';
        scannerSel.appendChild(o);
      });
    } catch (e) { scannerSel.innerHTML = '<option>impossible de charger</option>'; }
  }

  btnScan.onclick = async () => {
    scanResult.textContent = 'envoi…';
    try {
      const r = await fetch(apiBase + '/api/v1/scans', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          scannerId: scannerSel.value,
          profile: { name: 'test-ws-ui', source: $('source').value, resolution: parseInt($('resolution').value || '300', 10) }
        })
      });
      const body = await r.text();
      scanResult.textContent = r.status + ' ' + body.slice(0, 200);
    } catch (e) { scanResult.textContent = 'erreur: ' + e; }
  };

  loadScanners();
})();
</script>
</body>
</html>
