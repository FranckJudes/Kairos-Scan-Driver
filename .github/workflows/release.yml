name: Release — Build Installers & Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish OpenScan.Agent (win-x64, self-contained)
        run: >
          dotnet publish src/OpenScan.Agent/OpenScan.Agent.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o publish/win-x64

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer (.exe)
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.version.outputs.VERSION }}
          /DPublishDir=publish\win-x64
          scripts\windows-installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/OpenScanEngineSetup-*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish OpenScan.Agent (linux-x64, self-contained)
        run: >
          dotnet publish src/OpenScan.Agent/OpenScan.Agent.csproj
          -c Release
          -r linux-x64
          --self-contained
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o publish/linux-x64

      - name: Build .deb package tree
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PKG="debian-pkg"

          # Arborescence du paquet (DEBIAN doit être exactement 0755)
          mkdir -p "${PKG}/opt/openscan-agent"
          mkdir -p "${PKG}/etc/systemd/system"
          mkdir -m 0755 -p "${PKG}/DEBIAN"

          # Fichiers binaires
          cp -r publish/linux-x64/* "${PKG}/opt/openscan-agent/"
          chmod 755 "${PKG}/opt/openscan-agent/OpenScan.Agent"

          # Fichier unit systemd
          cp scripts/openscan-agent.service "${PKG}/etc/systemd/system/openscan-agent.service"

          # DEBIAN/control
          # (généré via printf, pas de heredoc : un terminateur "EOF" indenté pour suivre
          # l'indentation YAML du bloc "run: |" n'est jamais reconnu par bash comme la fin du
          # heredoc sans "<<-" + tabulations réelles, ce qui avalerait silencieusement tout le
          # reste du script comme contenu littéral du fichier control)
          {
            printf 'Package: openscan-agent\n'
            printf 'Version: %s\n' "${VERSION}"
            printf 'Architecture: amd64\n'
            printf 'Maintainer: FranckJudes <franck@kairos-scan.dev>\n'
            printf 'Description: Agent local de numérisation Kairos Scan Engine\n'
            printf ' Expose une API HTTP/WebSocket locale pour piloter les scanners\n'
            printf ' SANE, WIA, TWAIN et eSCL détectés sur le poste.\n'
            printf 'Section: utils\n'
            printf 'Priority: optional\n'
          } > "${PKG}/DEBIAN/control"

          # DEBIAN/postinst
          cp debian/postinst "${PKG}/DEBIAN/postinst"
          chmod 755 "${PKG}/DEBIAN/postinst"

          # DEBIAN/postrm
          cp debian/postrm "${PKG}/DEBIAN/postrm"
          chmod 755 "${PKG}/DEBIAN/postrm"

          # Ensure DEBIAN dir permissions are preserved
          chmod 0755 "${PKG}/DEBIAN"

      - name: Build .deb package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p installers
          dpkg-deb --build --root-owner-group debian-pkg "installers/openscan-agent_${VERSION}_amd64.deb"

      - name: Validate .deb package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          dpkg-deb --info "installers/openscan-agent_${VERSION}_amd64.deb"
          dpkg-deb --contents "installers/openscan-agent_${VERSION}_amd64.deb" | head -30

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: installers/openscan-agent_*.deb
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/

      - name: Download Linux .deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Kairos Scan Engine ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
